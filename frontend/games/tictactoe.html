<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Tic Tac Toe - MindHub</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- CSS -->
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/tictactoe.css">
        <link rel="stylesheet" href="../css/responsive.css">
    </head>
    <body class="game-page">
        <main class="tictactoe-section">
            <h1>Tic Tac Toe</h1>
            
            <!-- MODE OVERLAY -->
            <div id="mode-overlay" class="mode-overlay">
                <div class="auth-card mode-card">
                    <h2>Scegli modalità</h2>
                    <p>Come vuoi giocare?</p>
                    <div class="mode-selection">
                        <button id="pvp-btn">Player vs Player</button>
                        <button id="cpu-btn">Player vs CPU</button>
                    </div>
                </div>
            </div>

            <!-- STATUS -->
            <p id="game-status">Seleziona una modalità</p>
    
            <!-- BOARD -->
            <div id="board" class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <!-- ACTIONS -->
            <button id="reset-btn" class="reset-btn">Reset</button>

            <a href="../index.html" class="back-home">← Torna alla home</a>

        </main>

        <div id="result-overlay" class="result-overlay">
            <div class="auth-card result-card">
                
                <h2 id="result-title">Hai vinto!</h2>
                <p id="result-text">Fine partita</p>
                
                <div class="result-buttons">
                    <button id="play-again-btn">Nuova partita</button>
                    <a href="../index.html">Torna alla home</a>
                </div>
            </div>
        </div>
        <script src="../js/tictactoe.js"></script>

    </body>
</html>
