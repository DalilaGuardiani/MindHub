<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile - MindHub</title>
        
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/profile.css">
        <link rel="stylesheet" href="../css/responsive.css">
    </head>
    
    <body>
        
        <section class="profile-section">
            
            <div class="profile-card">

                <div class="profile-header">

                    <div class="profile-avatar">👤</div>

                    <h1 id="profile-username-title">User</h1>
                    <p class="profile-subtitle">MindHub Player</p>
                </div>

                <div class="profile-info">
                    <p>
                        <span>Username:</span>
                        <span id="profile-username">User</span>
                    </p>

                    <p>
                        <span>Email:</span>
                        <span id="profile-email">Not available</span>
                    </p>

                    <p>
                        <span>Total Points:</span>
                        <span id="profile-points">2450</span>
                    </p>
                </div>
                
                <div class="profile-stats">
                    <div class="stat-box">
                        <h3>Memory</h3>
                        <p>Best score: 2450</p>
                    </div>

                    <div class="stat-box">
                        <h3>Sudoku</h3>
                        <p>Completed: 3</p>
                    </div>

                    <div class="stat-box">
                        <h3>Tic Tac Toe</h3>
                        <p>Wins: 5</p>
                    </div>
                </div>
                <div class="profile-actions">
                    <a href="../index.html">Home</a>
                    <button id="logout-btn">Logout</button>
                </div>
            </div>
        </section>
        <script src="../js/profile.js"></script>
    </body>
</html>
