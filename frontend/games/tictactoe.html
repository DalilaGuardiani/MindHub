<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Tic Tac Toe - MindHub</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- CSS -->
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/tictactoe.css">
        <link rel="stylesheet" href="../css/responsive.css">
    </head>
    <body class="game-page">
        <main class="tictactoe-section">
            <h1>Tic Tac Toe</h1>
            
            <!-- MODE OVERLAY -->
            <div id="mode-overlay" class="mode-overlay">
                <div class="auth-card mode-card">
                    <h2>Choose mode</h2>
                    <p>How do you want to play?</p>
                    <div class="mode-selection">
                        <button id="pvp-btn">Player vs Player</button>
                        <button id="cpu-btn">Player vs CPU</button>
                    </div>
                </div>
            </div>

            <!-- STATUS -->
            <p id="game-status">Choose a mode</p>
    
            <!-- BOARD -->
            <div id="board" class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <!-- ACTIONS -->
            <button id="reset-btn" class="reset-btn">Restart</button>

            <a href="../index.html" class="back-home">← Back home</a>

        </main>

        <div id="result-overlay" class="result-overlay game-popup-overlay">
            <div class="auth-card result-card game-popup-card">
                
                <h2 id="result-title">You Won!</h2>
                <p id="result-text">Game over</p>
                
                <div class="result-buttons game-popup-buttons">
                    <button id="play-again-btn">New Game</button>
                    <a href="../index.html">Back home</a>
                </div>
            </div>
        </div>

        <script src="../js/game-guard.js"></script>
        <script src="../js/api.js"></script>
        <script src="../js/scores.js"></script>
        <script src="../js/tictactoe.js"></script>
    </body>
</html>
