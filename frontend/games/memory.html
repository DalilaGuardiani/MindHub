<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory - MindHub</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/memory.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="game-page">

  <section class="memory-section">

    <h1>Memory</h1>

    <div class="memory-info">
      <div class="info-box">
        Moves: <span id="moves">0</span>
      </div>

      <div class="info-box">
        Matches: <span id="matches">0</span>/6
      </div>
    </div>

    <div id="memory-grid" class="memory-grid"></div>

    <p id="win-message" class="win-message"></p>

    <button id="restart-btn">Restart</button>

    <a href="../index.html" class="back-home">← Back home</a>

  </section>
  <div id="memory-win-overlay" class="memory-win-overlay game-popup-overlay">
    <div class="auth-card memory-win-card game-popup-card">
      <h2>You Won!</h2>
      <p id="memory-win-text">You completed the Memory game.</p>
      <div class="memory-win-buttons game-popup-buttons">
        <button id="memory-new-game-btn">
          New Game
        </button>

        <a href="../index.html">
          ← Back home
        </a>
      </div>
    </div>
  </div>

  <script src="../js/game-guard.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/scores.js"></script>
  <script src="../js/memory.js"></script>
</body>
</html>
